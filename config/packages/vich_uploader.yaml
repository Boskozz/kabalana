vich_uploader:
    db_driver: orm

    metadata:
        type: attribute

    mappings:
        media:
            uri_prefix: /uploads
            upload_destination: '%kernel.project_dir%/public/uploads'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            directory_namer:
                service: Vich\UploaderBundle\Naming\PropertyDirectoryNamer
                options: { property: 'type' }
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        bloc_private_audio:
            uri_prefix: /bloc-private
            upload_destination: '%kernel.project_dir%/var/uploads/bloc_audio'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true